<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toplu Etiket Yazdır</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20260919-label-pagination-v7') }}">
    <style media="print">@page { size: 50mm 50mm; margin: 0; }</style>
</head>
<body class="print-page compact-label-print-page bulk-label-print-page">
    <div class="print-actions no-print">
        <button type="button" class="primary-button" onclick="window.print()">Yazdır</button>
        <button type="button" class="ghost-button" onclick="returnToProducts()">Kapat</button>
    </div>

    <section class="bulk-label-sheet">
        {% for item in labels %}
        <div class="bulk-label-item">
            {% set product = item.product %}
            {% set barcode_svg = item.barcode_svg %}
            {% set barcode_value = item.barcode_value %}
            {% include "products/_label_card.html" %}
        </div>
        {% endfor %}
    </section>

    <script>
    function returnToProducts() {
        if (window.opener && !window.opener.closed) {
            window.close();
            return;
        }
        if (window.history.length > 1) {
            window.history.back();
            return;
        }
        window.location.href = "{{ url_for('products.index') }}";
    }

    window.addEventListener("load", () => {
        window.setTimeout(() => window.print(), 250);
    });
    </script>
</body>
</html>
