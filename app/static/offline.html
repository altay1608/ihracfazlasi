<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d2824">
    <title>Bağlantı Bekleniyor | İhraç Fazlası Giyim</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4efe6; color: #31201e; font-family: Arial, sans-serif; }
        main { width: min(100%, 420px); border: 1px solid #ddc787; border-radius: 8px; padding: 32px; background: #fffdf9; box-shadow: 0 12px 28px rgba(49, 32, 30, .12); }
        p { color: #745f59; line-height: 1.5; }
        button { border: 0; border-radius: 6px; padding: 11px 16px; background: #9d1c1a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <p>İHRAÇ FAZLASI GİYİM</p>
        <h1>Bağlantı kurulamadı</h1>
        <p>Güncel stok ve finans verileri için bağlantının yeniden kurulması gerekiyor.</p>
        <button type="button" onclick="window.location.reload()">Yenile</button>
    </main>
</body>
</html>
